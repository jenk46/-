<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>두통 스무고개 — 약물 맞춤 가이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gothic+A1:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#fef6f9;
    --bg-2:#eef5fb;
    --card:#ffffff;
    --ink:#5a5160;
    --ink-soft:#9a93a3;
    --pink:#ffb7c9;
    --pink-deep:#f48fb1;
    --lav:#c9b8e8;
    --lav-deep:#a98fd6;
    --mint:#a8ddca;
    --mint-deep:#6fc7a8;
    --sky:#a9cdf0;
    --sky-deep:#7fb0e0;
    --lemon:#ffe09a;
    --peach:#ffc9a3;
    --coral:#ff9e9e;
    --line:#f0e6ee;
    --rx-color:#7f8fa6;
    --shadow:rgba(180,150,180,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Gothic A1',sans-serif;
    background:
      radial-gradient(circle at 12% 8%, #fde4ef 0%, transparent 38%),
      radial-gradient(circle at 88% 92%, #e1eefb 0%, transparent 42%),
      radial-gradient(circle at 92% 6%, #fff2d6 0%, transparent 30%),
      linear-gradient(160deg,var(--bg-1),var(--bg-2));
    color:var(--ink);
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:30px 16px 60px;
    -webkit-font-smoothing:antialiased;
  }
  .shell{width:100%;max-width:560px;}

  header.brand{text-align:center;margin-bottom:22px;}
  .mascot{
    font-size:46px;line-height:1;display:inline-block;
    filter:drop-shadow(0 6px 8px rgba(244,143,177,.35));
    animation:bob 3s ease-in-out infinite;
  }
  @keyframes bob{50%{transform:translateY(-7px) rotate(-4deg);}}
  .brand h1{
    font-family:'Jua',sans-serif;
    font-size:31px;color:#7a6b86;margin-top:6px;letter-spacing:.01em;
  }
  .brand h1 span{color:var(--pink-deep);}
  .brand p{
    margin-top:8px;font-size:13px;color:var(--ink-soft);line-height:1.65;font-weight:500;
  }

  .progress-wrap{margin:0 6px 20px;}
  .progress-meta{
    display:flex;justify-content:space-between;
    font-size:11.5px;font-weight:700;color:var(--ink-soft);
    margin-bottom:7px;letter-spacing:.02em;
  }
  .progress-meta .stage-name{color:var(--lav-deep);}
  .progress-track{
    height:12px;background:#fff;border-radius:99px;
    box-shadow:inset 0 2px 5px rgba(180,150,180,.18);
    padding:3px;
  }
  .progress-fill{
    height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--pink),var(--lav),var(--sky));
    background-size:200% 100%;
    transition:width .55s cubic-bezier(.34,1.3,.5,1);
    animation:flow 4s linear infinite;
  }
  @keyframes flow{to{background-position:200% 0;}}

  .card{
    background:var(--card);
    border-radius:26px;
    padding:30px 26px;
    box-shadow:0 20px 44px -20px var(--shadow), 0 2px 0 #fff inset;
    border:2px solid #fff;
  }
  .chip{
    display:inline-block;
    font-size:11px;font-weight:800;letter-spacing:.06em;
    padding:6px 14px;border-radius:99px;
    background:var(--bg-2);color:var(--sky-deep);
    margin-bottom:16px;
  }
  .chip.pink{background:#ffeef3;color:var(--pink-deep);}
  .chip.lav{background:#f0eafb;color:var(--lav-deep);}
  .chip.mint{background:#e3f6ee;color:var(--mint-deep);}

  .q-text{
    font-family:'Jua',sans-serif;
    font-size:22px;line-height:1.5;color:#6a5d77;margin-bottom:9px;
  }
  .q-hint{
    font-size:12.5px;color:var(--ink-soft);line-height:1.7;
    margin-bottom:22px;font-weight:500;
    background:#faf6fb;border-radius:12px;padding:11px 13px;
  }
  .q-hint::before{content:"💡 ";}

  .yn{display:flex;gap:12px;}
  .yn button{
    flex:1;
    font-family:'Jua',sans-serif;
    font-size:18px;
    padding:20px 12px;border:none;border-radius:18px;cursor:pointer;
    transition:transform .15s cubic-bezier(.34,1.5,.5,1),box-shadow .15s;
    color:#fff;
  }
  .yn .yes{background:linear-gradient(150deg,var(--pink),var(--coral));box-shadow:0 8px 16px -6px rgba(255,142,142,.6);}
  .yn .no{background:linear-gradient(150deg,var(--sky),var(--lav));box-shadow:0 8px 16px -6px rgba(169,143,214,.6);}
  .yn button:hover{transform:translateY(-3px) scale(1.03);}
  .yn button:active{transform:translateY(0) scale(.98);}
  .yn button small{display:block;font-family:'Gothic A1';font-size:11px;font-weight:600;opacity:.9;margin-top:3px;}

  .opts{display:flex;flex-direction:column;gap:10px;}
  .opts button{
    text-align:left;font-family:'Gothic A1';font-weight:600;font-size:14.5px;
    color:var(--ink);background:#faf7fb;border:2px solid var(--line);
    padding:15px 16px;border-radius:16px;cursor:pointer;
    transition:.15s;display:flex;align-items:center;gap:11px;
  }
  .opts button:hover{border-color:var(--lav);background:#fff;transform:translateX(4px);}
  .opts button .em{font-size:20px;flex:none;}

  .result-emoji{font-size:52px;text-align:center;margin-bottom:6px;}
  .result-title{
    font-family:'Jua',sans-serif;font-size:24px;text-align:center;
    color:#6a5d77;line-height:1.45;margin-bottom:6px;
  }
  .result-sub{
    text-align:center;font-size:12.5px;color:var(--ink-soft);
    font-weight:600;margin-bottom:18px;
  }
  .meter{display:flex;gap:5px;margin:0 auto 20px;max-width:240px;}
  .meter i{flex:1;height:9px;border-radius:99px;background:#eee5ee;}
  .meter i.on1{background:var(--mint);}
  .meter i.on2{background:var(--lemon);}
  .meter i.on3{background:var(--peach);}
  .meter i.on4{background:var(--coral);}

  .result-body{font-size:13.5px;line-height:1.85;color:#6a6270;}
  .result-body p{margin-bottom:11px;}
  .result-body b{color:var(--pink-deep);}

  .panel{
    border-radius:18px;padding:16px 17px;margin:15px 0;
    font-size:13px;line-height:1.75;font-weight:500;
  }
  .panel h4{font-family:'Jua',sans-serif;font-size:15px;margin-bottom:7px;font-weight:400;}
  .panel.med{background:#e3f6ee;color:#3f6e5b;}
  .panel.med h4{color:var(--mint-deep);}
  .panel.tip{background:#fff4d9;color:#8a7440;}
  .panel.tip h4{color:#d4a73a;}
  .panel.care{background:#ffe9ec;color:#9c5564;}
  .panel.care h4{color:var(--pink-deep);}
  .panel.info{background:#e7eefb;color:#4f6485;}
  .panel.info h4{color:var(--sky-deep);}
  .panel ul{margin:4px 0 0 2px;list-style:none;}
  .panel li{padding-left:18px;position:relative;margin-bottom:4px;}
  .panel li::before{content:"·";position:absolute;left:6px;font-weight:800;}

  .drug-row{
    display:flex;align-items:center;gap:10px;
    background:#fff;border-radius:12px;padding:10px 12px;margin-top:7px;
    border:1.5px solid #d8eee4;
  }
  .drug-row.rx {
    border:1.5px solid #c8d6e5;
  }
  .drug-row .pic{font-size:22px;flex:none;}
  .drug-row .txt{font-size:12.5px;line-height:1.5;}
  .drug-row .txt b{color:var(--mint-deep);}
  .drug-row.rx .txt b{color:var(--rx-color);}
  
  .badge-otc { display:inline-block; font-size:10px; background:var(--mint-deep); color:#fff; padding:2px 6px; border-radius:4px; margin-left:4px; vertical-align:middle;}
  .badge-rx { display:inline-block; font-size:10px; background:var(--rx-color); color:#fff; padding:2px 6px; border-radius:4px; margin-left:4px; vertical-align:middle;}

  .actions{display:flex;gap:10px;margin-top:22px;}
  .actions button{
    flex:1;font-family:'Jua',sans-serif;font-size:15px;
    padding:14px;border-radius:15px;cursor:pointer;border:none;
    transition:.15s;
  }
  .btn-main{background:linear-gradient(150deg,var(--lav),var(--sky));color:#fff;}
  .btn-main:hover{transform:translateY(-2px);}
  .btn-sub{background:#f3eef5;color:var(--ink-soft);}
  .btn-sub:hover{background:#eae2ee;}

  .disclaimer{
    margin-top:20px;font-size:11px;line-height:1.7;text-align:center;
    color:var(--ink-soft);font-weight:500;padding:0 10px;
  }
  .disclaimer b{color:var(--coral);}

  .pop{animation:pop .4s cubic-bezier(.34,1.4,.5,1);}
  @keyframes pop{from{opacity:0;transform:scale(.96) translateY(12px);}to{opacity:1;transform:scale(1) translateY(0);}}

  @media(max-width:430px){
    .card{padding:25px 20px;}
    .brand h1{font-size:26px;}
    .q-text{font-size:19px;}
  }
</style>
</head>
<body>
<div class="shell">

  <header class="brand">
    <div class="mascot">🧸</div>
    <h1>두통 <span>스무고개</span></h1>
    <p>예 / 아니요로 차근차근 답하다 보면<br>지금 내 두통이 어떤 상태인지 함께 알아봐요.</p>
  </header>

  <div class="progress-wrap">
    <div class="progress-meta">
      <span class="stage-name" id="stageName">시작해요</span>
      <span id="stageCount"></span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="bar"></div></div>
  </div>

  <div id="stage"></div>

  <p class="disclaimer">
    이 앱은 교육·참고용 가이드 도구입니다.<br>
    안내되는 <b>일반의약품(OTC)</b> 및 <b>전문의약품(Rx)</b> 정보는 전문가 상담 시 참고용으로 활용하세요.
  </p>
</div>

<script>
const stage=document.getElementById('stage');
const bar=document.getElementById('bar');
const stageName=document.getElementById('stageName');
const stageCount=document.getElementById('stageCount');

const S={
  redHits:0, redSevere:false,
  migPoint:0, tensPoint:0,
  severity:0, frequent:false, longLasting:false,
  overuse:false, triedOTC:null,
  nausea:false, aura:false
};

let answered=0;
const APPROX_TOTAL=16;

function progress(name){
  answered++;
  stageName.textContent=name;
  stageCount.textContent=answered+"번째 질문";
  bar.style.width=Math.min(answered/APPROX_TOTAL*100,96)+"%";
}
function progressDone(){
  stageName.textContent="다 왔어요!";
  stageCount.textContent="결과";
  bar.style.width="100%";
}

function askYesNo(o){
  progress(o.stage);
  stage.innerHTML=`
    <div class="card pop">
      <span class="chip ${o.chip||''}">${o.tag}</span>
      <div class="q-text">${o.q}</div>
      ${o.hint?`<div class="q-hint">${o.hint}</div>`:''}
      <div class="yn">
        <button class="yes">${o.yesLabel||'네, 그래요'}${o.yesSub?`<small>${o.yesSub}</small>`:''}</button>
        <button class="no">${o.noLabel||'아니요'}${o.noSub?`<small>${o.noSub}</small>`:''}</button>
      </div>
    </div>`;
  stage.querySelector('.yes').onclick=o.onYes;
  stage.querySelector('.no').onclick=o.onNo;
}
function askMulti(o){
  progress(o.stage);
  stage.innerHTML=`
    <div class="card pop">
      <span class="chip ${o.chip||''}">${o.tag}</span>
      <div class="q-text">${o.q}</div>
      ${o.hint?`<div class="q-hint">${o.hint}</div>`:''}
      <div class="opts"></div>
    </div>`;
  const box=stage.querySelector('.opts');
  o.options.forEach(op=>{
    const b=document.createElement('button');
    b.innerHTML=`<span class="em">${op.em}</span><span>${op.label}</span>`;
    b.onclick=()=>op.go();
    box.appendChild(b);
  });
}

/* 질문 로직 */
function stepA1(){ askYesNo({ stage:"안전 먼저 확인해요", chip:"pink", tag:"STEP 1 · 안전 체크", q:"혹시 지금 두통이 '태어나서 처음 느낄 만큼' 갑작스럽고 극심한가요?", hint:"몇 초~몇 분 사이에 통증이 최고조에 닿는 '벼락두통'을 말해요. 평소 두통과는 확연히 다른 느낌이에요.", yesLabel:"네, 그래요", noLabel:"아니요, 그 정도는 아니에요", onYes:stepA1b, onNo:stepA2 }); }
function stepA1b(){ askYesNo({ stage:"조금 더 확인할게요", chip:"pink", tag:"STEP 1 · 안전 체크", q:"그 극심한 통증이 지금도 이어지거나, 구토·의식 흐려짐이 같이 있나요?", onYes:()=>{S.redSevere=true;resultSeeDoctor();}, onNo:()=>{S.redHits++;stepA2();} }); }
function stepA2(){ askYesNo({ stage:"안전 먼저 확인해요", chip:"pink", tag:"STEP 1 · 안전 체크", q:"두통과 함께 열이 나거나, 목 뒤가 뻣뻣하게 굳는 느낌이 있나요?", onYes:()=>{S.redHits++;stepA3();}, onNo:stepA3 }); }
function stepA3(){ askYesNo({ stage:"안전 먼저 확인해요", chip:"pink", tag:"STEP 1 · 안전 체크", q:"한쪽 팔다리 힘 빠짐, 어눌한 말, 한쪽 시야 상실 같은 증상이 있나요?", onYes:()=>{S.redHits++;stepA4();}, onNo:stepA4 }); }
function stepA4(){ askYesNo({ stage:"안전 먼저 확인해요", chip:"pink", tag:"STEP 1 · 안전 체크", q:"평소 두통과 달리, 며칠에 걸쳐 점점 심해지거나 양상이 달라지고 있나요?", onYes:()=>{S.redHits++;routeAfterSafety();}, onNo:routeAfterSafety }); }
function routeAfterSafety(){ if(S.redHits>=2){ return resultSeeDoctor(); } stepB1(); }
function stepB1(){ askMulti({ stage:"어떤 두통인지 살펴봐요", chip:"lav", tag:"STEP 2 · 두통 유형", q:"통증의 '느낌'은 어느 쪽에 더 가까운가요?", options:[ {em:"💓",label:"심장 뛰듯 욱신욱신·지끈지끈 (박동성)",go:()=>{S.migPoint+=2;stepB2();}}, {em:"🎀",label:"머리를 띠로 조이듯 답답하게 (압박감)",go:()=>{S.tensPoint+=2;stepB2();}}, {em:"🤔",label:"잘 모르겠어요 / 그때그때 달라요",go:stepB2} ] }); }
function stepB2(){ askYesNo({ stage:"어떤 두통인지 살펴봐요", chip:"lav", tag:"STEP 2 · 두통 유형", q:"통증이 주로 머리 '한쪽'에 치우쳐 있나요?", onYes:()=>{S.migPoint++;stepB3();}, onNo:()=>{S.tensPoint++;stepB3();} }); }
function stepB3(){ askYesNo({ stage:"어떤 두통인지 살펴봐요", chip:"lav", tag:"STEP 2 · 두통 유형", q:"두통이 있을 때 빛이나 소리가 평소보다 유난히 거슬리나요?", onYes:()=>{S.migPoint++;stepB4();}, onNo:()=>{S.tensPoint++;stepB4();} }); }
function stepB4(){ askYesNo({ stage:"어떤 두통인지 살펴봐요", chip:"lav", tag:"STEP 2 · 두통 유형", q:"두통과 함께 속이 메스껍거나 토할 것 같은 느낌이 드나요?", onYes:()=>{S.nausea=true;S.migPoint++;stepB5();}, onNo:()=>{S.tensPoint++;stepB5();} }); }
function stepB5(){ askYesNo({ stage:"어떤 두통인지 살펴봐요", chip:"lav", tag:"STEP 2 · 두통 유형", q:"두통이 시작되기 전, 눈앞에 반짝임·지그재그 무늬가 보인 적이 있나요? (조짐)", onYes:()=>{S.aura=true;S.migPoint++;stepB6();}, onNo:stepB6 }); }
function stepB6(){ askYesNo({ stage:"어떤 두통인지 살펴봐요", chip:"lav", tag:"STEP 2 · 두통 유형", q:"몸을 움직이거나 계단을 오를 때 두통이 더 심해지나요?", onYes:()=>{S.migPoint++;stepC1();}, onNo:()=>{S.tensPoint++;stepC1();} }); }
function stepC1(){ askMulti({ stage:"증상 단계를 가늠해요", chip:"mint", tag:"STEP 3 · 강도", q:"두통이 있을 때, 일상생활은 어느 정도 가능한가요?", options:[ {em:"🙂",label:"조금 신경 쓰이지만 할 일은 다 할 수 있어요",go:()=>{S.severity=1;stepC2();}}, {em:"😟",label:"집중이 어렵고 능률이 뚝 떨어져요",go:()=>{S.severity=2;stepC2();}}, {em:"😣",label:"하던 일을 멈추고 쉬어야 할 정도예요",go:()=>{S.severity=3;stepC2();}}, {em:"😖",label:"누워 있어야 하고 아무것도 못 하겠어요",go:()=>{S.severity=4;stepC2();}} ] }); }
function stepC2(){ askMulti({ stage:"증상 단계를 가늠해요", chip:"mint", tag:"STEP 3 · 빈도", q:"이런 두통이 얼마나 자주 찾아오나요?", options:[ {em:"🍀",label:"아주 가끔 (한 달에 1~2번 이하)",go:stepC3}, {em:"🌧️",label:"종종 (한 달에 3~7번쯤)",go:stepC3}, {em:"⛈️",label:"자주 (일주일에 2번 이상)",go:()=>{S.frequent=true;stepC3();}} ] }); }
function stepC3(){ askYesNo({ stage:"증상 단계를 가늠해요", chip:"mint", tag:"STEP 3 · 지속", q:"한 번 시작되면, 쉬거나 약을 먹어도 3일 넘게 이어진 적이 있나요?", onYes:()=>{S.longLasting=true;stepC4();}, onNo:stepC4 }); }
function stepC4(){ askYesNo({ stage:"증상 단계를 가늠해요", chip:"mint", tag:"STEP 3 · 약물", q:"두통이 올 때 일반 진통제(타이레놀·이부프로펜 등)를 먹어 본 적 있나요?", onYes:stepC4b, onNo:()=>{S.triedOTC=null;finish();} }); }
function stepC4b(){ askYesNo({ stage:"증상 단계를 가늠해요", chip:"mint", tag:"STEP 3 · 약물", q:"그 진통제로 두통이 충분히 가라앉았나요?", onYes:()=>{S.triedOTC=true;stepC5();}, onNo:()=>{S.triedOTC=false;stepC5();} }); }
function stepC5(){ askYesNo({ stage:"증상 단계를 가늠해요", chip:"mint", tag:"STEP 3 · 약물", q:"두통약을 일주일에 3일 이상, 여러 주에 걸쳐 꾸준히 먹고 있나요?", onYes:()=>{S.overuse=true;finish();}, onNo:finish }); }

/* ===================== 결과 산출 ===================== */
function finish(){
  progressDone();
  const isMigraine = S.migPoint>=4 && S.migPoint>=S.tensPoint;
  const isTension  = !isMigraine && S.tensPoint>=3 && S.tensPoint>S.migPoint;
  if(isMigraine) resultMigraine();
  else if(isTension) resultTension();
  else resultUnclear();
}

function severityInfo(){
  if(S.severity<=1) return {n:1,label:"경증"};
  if(S.severity===2) return {n:2,label:"경증~중등도"};
  if(S.severity===3) return {n:3,label:"중등도~중증"};
  return {n:4,label:"중증"};
}
function meterHTML(level){
  const cls=["","on1","on2","on3","on4"][level.n];
  let h='<div class="meter">';
  for(let i=1;i<=4;i++) h+=`<i class="${i<=level.n?cls:''}"></i>`;
  return h+'</div>';
}
function softWarnPanel(){
  if(S.redHits===1){
    return `<div class="panel care"><h4>🔎 2차성 두통 감별 권장</h4>
      안전 체크에서 주의해야 할 신호가 하나 발견되었습니다. <b>2차성 두통 진단이 필요할 수 있으므로 병원에 가보시는 것을 추천합니다.</b></div>`;
  }
  return '';
}
function overusePanel(){
  if(S.overuse){
    return `<div class="panel tip"><h4>⚠️ 약물과용두통(MOH) 주의</h4>
      급성기 약물을 주 3일(월 10~15일) 이상 복용 중입니다. 약물 과용으로 인해 
      두통이 만성화될 위험이 큽니다. <b>원인 약물을 서서히 중단하고 예방요법으로의 전환</b>이 시급합니다.</div>`;
  }
  return '';
}
function preventivePanel(){
  if(S.frequent||S.longLasting||S.overuse){
    let r=[];
    if(S.frequent) r.push("발작 잦음(주 2회 이상)");
    if(S.longLasting) r.push("발작 3일 이상 지속");
    if(S.overuse) r.push("약물 과용");
    return `<div class="panel info"><h4>🛡️ 예방 요법 (Prophylactic Therapy) 권장</h4>
      두통 빈도와 강도를 고려할 때 급성기 약물만으로는 한계가 있어 <b>예방 치료 병행</b>이 필요합니다. (${r.join(' / ')})<br>
      <div class="drug-row rx"><span class="pic">💊</span><span class="txt">
        <b>1차 경구 예방약</b><span class="badge-rx">Rx</span><br>
        베타차단제 (Propranolol), 항경련제 (Topiramate, Valproate), 항우울제 (Amitriptyline), 칼슘채널차단제 (Flunarizine) 등 환자의 동반 질환에 맞춰 선택합니다.</span></div>
      <div class="drug-row rx"><span class="pic">💉</span><span class="txt">
        <b>CGRP 표적 치료제</b><span class="badge-rx">Rx</span><br>
        기존 경구약에 효과가 부족하거나 부작용이 심한 경우 고려할 수 있는 최신 주사제입니다. (Galcanezumab, Fremanezumab 등)</span></div>
      </div>`;
  }
  return '';
}

/* ---- 결과: 편두통 ---- */
function resultMigraine(){
  const lv=severityInfo();
  let drugBlock='';
  if(lv.n<=2){
    drugBlock=`
      <div class="panel med"><h4>💊 급성기 치료 (경증~중등도)</h4>
        초기 단계에서는 일반의약품을 먼저 시도해 볼 수 있습니다.
        <div class="drug-row"><span class="pic">🟢</span><span class="txt">
          <b>단일 진통제</b><span class="badge-otc">OTC</span> · 아세트아미노펜 또는 NSAIDs (Ibuprofen, Naproxen)</span></div>
        <div class="drug-row"><span class="pic">🔵</span><span class="txt">
          <b>복합 진통제</b><span class="badge-otc">OTC</span> · 아세트아미노펜 + 아스피린 + 카페인 복합제</span></div>
        <ul>
          <li>전구 증상기나 <b>두통 발작 초기에 신속히 투여</b>해야 효과가 극대화됩니다.</li>
          <li>오심/구토가 심할 경우 진통제 흡수가 저하되므로 위장관운동조절제(Domperidone 등) 병용을 고려합니다.</li>
        </ul>
      </div>`;
  } else {
    drugBlock=`
      <div class="panel med"><h4>💊 급성기 치료 (중등도~중증)</h4>
        통증이 심하거나 단순 진통제에 반응하지 않는 경우 <b>편두통 특이 약물</b>을 1차로 사용합니다.
        <div class="drug-row rx"><span class="pic">🟣</span><span class="txt">
          <b>트립탄 (Triptans) 계열</b><span class="badge-rx">Rx</span><br>
          Sumatriptan, Zolmitriptan, Almotriptan 등. 세로토닌 수용체 작용제로 혈관을 수축시켜 통증을 완화합니다.</span></div>
        <div class="drug-row rx"><span class="pic">🟠</span><span class="txt">
          <b>디탄 (Ditans) 계열</b><span class="badge-rx">Rx</span><br>
          Lasmiditan 등. 심혈관계 위험이 있는 환자에게 트립탄 대안으로 고려됩니다.</span></div>
        <ul>
          <li>트립탄 계열은 <b>허혈성 심질환, 뇌혈관 질환 환자에게는 금기(Contraindication)</b>입니다.</li>
          <li>발작 초기에 복용하는 것이 예후가 좋습니다.</li>
        </ul>
      </div>`;
  }

  stage.innerHTML=`
    <div class="card pop">
      <div class="result-emoji">🌸</div>
      <div class="result-title">편두통 (Migraine) <br>가능성이 높습니다</div>
      <div class="result-sub">현재 강도 단계 · ${lv.label}</div>
      ${meterHTML(lv)}
      <div class="result-body">
        <p>박동성 통증, 편측성, 광선/음 공포증, 오심 등 <b>편두통의 전형적인 임상 양상</b>이 관찰됩니다. 단계별 적절한 약물 선택을 통해 통증을 통제할 수 있습니다.</p>
        ${softWarnPanel()}
        ${drugBlock}
        ${overusePanel()}
        ${preventivePanel()}
        <div class="panel tip"><h4>🍵 비약물적 요법</h4>
          <ul>
            <li>유발 요인(Trigger) 회피: 스트레스, 수면 부족, 결식, 특정 음식(티라민, MSG 등)</li>
            <li>급성 발작 시 조용하고 어두운 환경에서 휴식</li>
            <li>정기적인 두통 일기 작성</li>
          </ul>
        </div>
      </div>
      <div class="actions">
        <button class="btn-sub" onclick="restart()">다시 체크</button>
        <button class="btn-main" onclick="restart()">완료</button>
      </div>
    </div>`;
}

/* ---- 결과: 긴장성 ---- */
function resultTension(){
  const lv=severityInfo();
  stage.innerHTML=`
    <div class="card pop">
      <div class="result-emoji">🍃</div>
      <div class="result-title">긴장형 두통 (TTH) <br>가능성이 높습니다</div>
      <div class="result-sub">현재 강도 단계 · ${lv.label}</div>
      ${meterHTML(lv)}
      <div class="result-body">
        <p>양측성 압박감, 비박동성 통증 등 <b>긴장형 두통</b>의 특징이 두드러집니다. 대개 일상생활에 심각한 지장을 주지 않으며, 스트레스나 근육 긴장과 연관이 깊습니다.</p>
        ${softWarnPanel()}
        <div class="panel med"><h4>💊 급성기 및 예방 치료</h4>
          <div class="drug-row"><span class="pic">🟢</span><span class="txt">
            <b>급성기 치료</b><span class="badge-otc">OTC</span><br>
            아세트아미노펜 또는 NSAIDs 계열이 1차 선택약입니다.</span></div>
          <div class="drug-row rx"><span class="pic">💊</span><span class="txt">
            <b>만성 긴장형 두통 예방</b><span class="badge-rx">Rx</span><br>
            증상이 만성화될 경우 삼환계 항우울제(Amitriptyline) 처방이 효과적일 수 있습니다.</span></div>
        </div>
        ${overusePanel()}
        <div class="panel tip"><h4>🌿 비약물적 요법 (중요)</h4>
          <ul>
            <li>물리치료, 승모근/경추부 마사지 및 온찜질</li>
            <li>규칙적인 스트레칭 및 올바른 자세 유지</li>
            <li>스트레스 관리 및 인지행동치료</li>
          </ul>
        </div>
      </div>
      <div class="actions">
        <button class="btn-sub" onclick="restart()">다시 체크</button>
        <button class="btn-main" onclick="restart()">완료</button>
      </div>
    </div>`;
}

/* ---- 결과: 불명확 ---- */
function resultUnclear(){
  const lv=severityInfo();
  stage.innerHTML=`
    <div class="card pop">
      <div class="result-emoji">🌤️</div>
      <div class="result-title">정확한 감별이<br>필요합니다</div>
      <div class="result-sub">현재 강도 단계 · ${lv.label}</div>
      ${meterHTML(lv)}
      <div class="result-body">
        <p>편두통과 긴장형 두통의 양상이 혼재되어 있어 감별 진단이 요구됩니다. (Probable Migraine 등 고려)</p>
        <div class="panel info"><h4>📒 권장 사항</h4>
          <ul>
            <li>정확한 진단을 위해 지속적인 <b>두통 일기</b> 작성이 필수적입니다.</li>
            <li>통증 조절을 위해 일차적으로 <b>NSAIDs</b><span class="badge-otc">OTC</span> 등을 시도해 볼 수 있습니다.</li>
            <li>증상이 악화되거나 빈도가 늘어나면 신경과 전문의 진료를 통한 평가가 필요합니다.</li>
          </ul>
        </div>
        ${softWarnPanel()}
        ${overusePanel()}
      </div>
      <div class="actions">
        <button class="btn-sub" onclick="restart()">다시 체크</button>
        <button class="btn-main" onclick="restart()">완료</button>
      </div>
    </div>`;
}

/* ---- 결과: 병원 방문 적극 권장 (2차성 두통 감별) ---- */
function resultSeeDoctor(){
  progressDone();
  stage.innerHTML=`
    <div class="card pop">
      <div class="result-emoji">🏥</div>
      <div class="result-title">2차성 두통 진단이<br>필요합니다</div>
      <div class="result-body">
        <p>체크하신 내용(극심한 통증, 신경학적 이상, 발열 등)은 기저 질환이 원인일 수 있는 <b>'2차성 두통(Secondary Headache)'</b>을 의심해 볼 수 있는 위험 신호(Red Flag)입니다.</p>
        <div class="panel care"><h4>👩‍⚕️ 병원에 가보시는 것을 강력히 추천합니다</h4>
          <ul>
            <li>단순 진통제를 복용하시기 전에, <b>2차성 두통 진단이 필요하므로 응급실이나 신경과 진료를 받아보시는 것을 추천합니다.</b></li>
            <li>전문의의 진단 및 뇌영상 검사(MRI/CT)를 통해 정확한 원인을 파악하는 것이 가장 중요합니다.</li>
          </ul>
        </div>
      </div>
      <div class="actions"><button class="btn-sub" onclick="restart()">처음으로 돌아가기</button></div>
    </div>`;
}

function restart(){
  Object.assign(S,{redHits:0,redSevere:false,migPoint:0,tensPoint:0,severity:0,frequent:false,longLasting:false,overuse:false,triedOTC:null,nausea:false,aura:false});
  answered=0; stepA1();
}

stepA1();
