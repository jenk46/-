<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>GERD Adventure - 위장의 비밀</title>
<style>
@import url('https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;user-select:none;font-family:'Galmuri11',monospace;}
#wrap{position:relative;width:800px;height:500px;margin:0 auto;background:#000;overflow:hidden;}

/* ===== INTRO ===== */
#intro{position:absolute;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:28px;}
#intro-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
#intro-bg img{max-width:100%;max-height:100%;object-fit:contain;opacity:0;transition:opacity 1s;}
#intro-title{color:#cc3333;font-size:20px;text-shadow:0 0 16px #ff2200;letter-spacing:4px;margin-bottom:16px;position:relative;z-index:2;}
#intro-box{width:740px;background:rgba(0,0,0,0.88);border:2px solid #444;border-radius:3px;padding:16px 20px;position:relative;z-index:2;}
#intro-spk{color:#88ffaa;font-size:12px;margin-bottom:5px;min-height:14px;}
#intro-txt{color:#fff;font-size:14px;line-height:1.75;min-height:68px;white-space:pre-wrap;}
#intro-cursor{display:inline-block;width:9px;height:14px;background:#fff;animation:blink .7s infinite;vertical-align:middle;margin-left:2px;}
#intro-arrow{position:absolute;bottom:8px;right:12px;color:#555;font-size:11px;animation:blink 1s infinite;}
#intro-skip{color:#444;font-size:11px;margin-top:8px;cursor:pointer;position:relative;z-index:2;transition:color .2s;}
#intro-skip:hover{color:#888;}

/* ===== GAME ===== */
#game{position:absolute;inset:0;display:none;}
canvas{position:absolute;top:0;left:0;}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .7s;z-index:10;}

/* HUD */
#hud{position:absolute;top:8px;right:8px;z-index:20;display:flex;flex-direction:column;align-items:center;gap:2px;}
#hud-label{font-size:10px;color:#fff;text-shadow:1px 1px 0 #000;background:rgba(0,0,0,.5);padding:1px 6px;border-radius:2px;}
#hud-gauge{width:56px;image-rendering:pixelated;filter:drop-shadow(0 0 3px rgba(0,220,0,.5));}
#hud-pct{font-size:10px;color:#aaff44;text-shadow:1px 1px 0 #000;}
#area-tag{position:absolute;top:8px;left:8px;z-index:20;font-size:11px;color:#fff;text-shadow:1px 1px 0 #000;background:rgba(0,0,0,.55);padding:3px 10px;border:1px solid rgba(255,255,255,.2);border-radius:2px;}

/* STORY */
#story{position:absolute;bottom:0;left:0;right:0;height:112px;background:rgba(0,0,0,.87);border-top:2px solid rgba(80,200,80,.35);z-index:20;padding:8px 14px;display:none;}
#story-spk{font-size:11px;color:#aaffaa;margin-bottom:4px;}
#story-txt{font-size:13px;color:#fff;line-height:1.6;white-space:pre-wrap;}
#story-arr{position:absolute;bottom:5px;right:11px;font-size:11px;color:#555;animation:blink 1s infinite;}

/* QUIZ */
#quiz-modal{position:absolute;inset:0;background:rgba(0,0,0,.82);z-index:50;display:none;align-items:center;justify-content:center;}
#quiz-box{width:680px;background:#08120a;border:2px solid #2a6a2a;border-radius:4px;padding:18px 20px;}
.qhdr{display:flex;justify-content:space-between;margin-bottom:10px;font-size:11px;}
#quiz-no{color:#66aa66;}
#quiz-hp{color:#ff6644;}
#quiz-q{font-size:14px;color:#eeffee;line-height:1.6;margin-bottom:12px;white-space:pre-wrap;}
.qopt{display:block;width:100%;padding:8px 12px;margin-bottom:6px;background:rgba(255,255,255,.05);border:1px solid #2a3a2a;border-radius:3px;color:#cceedd;font-size:12px;font-family:'Galmuri11',monospace;cursor:pointer;text-align:left;transition:background .15s;}
.qopt:hover:not(:disabled){background:rgba(100,200,100,.12);border-color:#4a8a4a;}
.qopt.correct{background:rgba(0,200,80,.2);border-color:#00cc50;color:#aaffcc;pointer-events:none;}
.qopt.wrong{background:rgba(200,50,50,.2);border-color:#cc3333;color:#ffaaaa;text-decoration:line-through;pointer-events:none;}
#quiz-exp{font-size:11px;color:#88aaaa;line-height:1.5;margin-top:8px;padding:7px 9px;background:rgba(0,100,100,.15);border-left:3px solid #2a8a8a;display:none;}
#quiz-next{display:none;width:100%;padding:8px;background:#1a4a1a;border:1px solid #3a8a3a;border-radius:3px;color:#aaffaa;font-size:13px;font-family:'Galmuri11',monospace;cursor:pointer;margin-top:8px;transition:background .15s;}
#quiz-next:hover{background:#2a6a2a;}

/* GAME OVER */
#gameover-screen{position:absolute;inset:0;background:rgba(0,0,0,.92);z-index:80;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;}
#go-title{font-size:28px;color:#ff3300;text-shadow:0 0 20px #ff0000;letter-spacing:6px;}
#go-msg{font-size:14px;color:#ff8866;text-align:center;line-height:1.8;}
#go-retry{padding:12px 32px;background:#3a0a0a;border:2px solid #cc3300;border-radius:4px;color:#ff9977;font-size:14px;font-family:'Galmuri11',monospace;cursor:pointer;transition:background .2s;}
#go-retry:hover{background:#5a1a0a;}

/* ENDING */
#ending-screen{position:absolute;inset:0;background:#000;z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px;}
#end-title{font-size:22px;color:#aaffaa;text-shadow:0 0 12px #00ff88;letter-spacing:4px;margin-bottom:20px;}
#end-msg{font-size:14px;color:#ccffcc;line-height:1.9;text-align:center;max-width:680px;white-space:pre-wrap;margin-bottom:24px;}
#end-score{font-size:13px;color:#aacc88;margin-bottom:16px;}
#end-btn{padding:10px 28px;background:#0a2a0a;border:1px solid #3a8a3a;border-radius:3px;color:#aaffaa;font-size:13px;font-family:'Galmuri11',monospace;cursor:pointer;}
#end-btn:hover{background:#1a3a1a;}

@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
</style>
</head>
<body>
<div id="wrap">

<!-- INTRO -->
<div id="intro">
  <div id="intro-bg"><img id="intro-img" src="" alt=""></div>
  <div id="intro-title">★ GERD ADVENTURE ★</div>
  <div id="intro-box">
    <div id="intro-spk"></div>
    <div id="intro-txt"></div>
    <span id="intro-cursor"></span>
    <div id="intro-arrow">▼ SPACE / CLICK</div>
  </div>
  <div id="intro-skip" onclick="skipIntro()">[ 건너뛰기 ]</div>
</div>

<!-- GAME -->
<div id="game">
  <canvas id="canvas" width="800" height="500"></canvas>
  <div id="fade"></div>
  <div id="hud">
    <div id="hud-label">위장 상태</div>
    <img id="hud-gauge" src="" alt="">
    <div id="hud-pct">0%</div>
  </div>
  <div id="area-tag">구강 (Oral Cavity)</div>
  <div id="story">
    <div id="story-spk"></div>
    <div id="story-txt"></div>
    <div id="story-arr">▼</div>
  </div>
</div>

<!-- QUIZ -->
<div id="quiz-modal">
  <div id="quiz-box">
    <div class="qhdr"><span id="quiz-no">문제 1/10</span><span id="quiz-hp">위장 상태: 0%</span></div>
    <div id="quiz-q"></div>
    <div id="quiz-opts"></div>
    <div id="quiz-exp"></div>
    <button id="quiz-next" onclick="closeQuiz()">계속 진행 ▶</button>
  </div>
</div>

<!-- GAME OVER -->
<div id="gameover-screen">
  <div id="go-title">☠ GERD 악화 ☠</div>
  <div id="go-msg">위장이 위산으로 가득 찼습니다.
너무 많은 퀴즈를 틀려버렸어요...

하지만 괜찮아요. 다시 도전해봐요!</div>
  <button id="go-retry" onclick="retryGame()">▶ 다시 시작</button>
</div>

<!-- ENDING -->
<div id="ending-screen">
  <div id="end-title">★ GERD 치료 완료! ★</div>
  <div id="end-msg" id="end-msg"></div>
  <div id="end-score"></div>
  <button id="end-btn" onclick="restartAll()">▶ 처음부터 다시하기</button>
</div>

</div>

let iIdx=0, iTyping=false, iFull='', iShown='', iTimer=null, iWaiting=false;
function iType(){
  if(iShown.length<iFull.length){
    iShown+=iFull[iShown.length];
    document.getElementById('intro-txt').textContent=iShown;
    iTimer=setTimeout(iType,36);
  }else{iTyping=false;iWaiting=true;}
}
function showScene(idx){
  if(idx>=INTRO_SCRIPT.length){startGame();return;}
  const s=INTRO_SCRIPT[idx];
  document.getElementById('intro-spk').textContent=s.spk?`[ ${s.spk} ]`:'';
  const imgEl=document.getElementById('intro-img');
  imgEl.src=s.img?GF_IMG:'';
  imgEl.style.opacity=s.img?'0.55':'0';
  iFull=s.txt; iShown=''; iTyping=true; iWaiting=false;
  document.getElementById('intro-txt').textContent='';
  if(iTimer)clearTimeout(iTimer);
  iTimer=setTimeout(iType,36);
}
function advIntro(){
  if(iTyping){clearTimeout(iTimer);iShown=iFull;document.getElementById('intro-txt').textContent=iShown;iTyping=false;iWaiting=true;return;}
  if(iWaiting){iIdx++;showScene(iIdx);}
}
function skipIntro(){if(iTimer)clearTimeout(iTimer);startGame();}
document.getElementById('intro').addEventListener('click',advIntro);
showScene(0);

  1:[{spk:'나',txt:'식도(食道)다.\n연동운동으로 음식을 위장으로 밀어내는 관.\n그리고... GERD의 핵심 전쟁터.'},
     {spk:'나',txt:'하부식도괄약근(LES)이 느슨해지면\n위산이 역류해서 이 점막을 공격해.\n그 타는 느낌이 바로 여기서 오는 거야.'}],
  2:[{spk:'나',txt:'위장(胃臟)이다.\n강산성(pH 1.5~3.5) 환경, 위산과 펩신이 가득해.\n조심해... 위액이 떨어지고 있어!'},
     {spk:'나',txt:'⚠ 위액에 맞으면 GERD 퀴즈가 출제됩니다.\n정답 → 통과 | 오답 → 위장 게이지 +20%\n게이지가 100%가 되면 GAME OVER!'}],
  3:[{spk:'나',txt:'위장 2구역...\n아직도 위액이 쏟아지고 있어.\n마지막 구간이야. 버텨!'}]
};

// Pick 10 random questions, 5+5 for 2 stomach maps
function pickQuiz(){
  const sh=[...ALL_Q].sort(()=>Math.random()-.5);
  return [sh.slice(0,5), sh.slice(5,10)];
}
let quizSets=pickQuiz();
let quizCount=[0,0];
let wrongCount=0; // total wrong answers

const gs={
  mapIdx:0, px:80, py:0, dir:'right',
  fIdx:0, fTimer:0, moving:false,
  hp:0, transitioning:false,
  storyActive:false, storyTyping:false,
  storyFull:'', storyShown:'', storyTimer:null,
  keys:{},
  slimes:[], slimeTimer:0, hitCD:0,
  quizActive:false, gameOver:false, ended:false,
  mapEntryDone:{},
  loopId:null,
};
const GROUND_Y=PLAY_H-125;
gs.py=GROUND_Y;
const PW=64, PH=120, WALK=3, FD=6;
let storyQueue=[];

// HUD
function updateHUD(){
  const idx=Math.min(Math.floor(gs.hp/20),5);
  const g=document.getElementById('hud-gauge');
  if(gaugeImgs[idx]?.complete&&gaugeImgs[idx].naturalWidth)g.src=gaugeImgs[idx].src;
  document.getElementById('hud-pct').textContent=gs.hp+'%';
  document.getElementById('area-tag').textContent=MAP_NAMES[gs.mapIdx];
}

// STORY
function showStories(arr){storyQueue=[...arr];if(!gs.storyActive)nextStory();}
function nextStory(){
  if(!storyQueue.length){endStory();return;}
  gs.storyActive=true;
  document.getElementById('story').style.display='block';
  const s=storyQueue.shift();
  document.getElementById('story-spk').textContent=s.spk?`[ ${s.spk} ]`:'';
  gs.storyFull=s.txt;gs.storyShown='';gs.storyTyping=true;
  document.getElementById('story-txt').textContent='';
  if(gs.storyTimer)clearTimeout(gs.storyTimer);
  sType();
}
function sType(){
  if(gs.storyShown.length<gs.storyFull.length){
    gs.storyShown+=gs.storyFull[gs.storyShown.length];
    document.getElementById('story-txt').textContent=gs.storyShown;
    gs.storyTimer=setTimeout(sType,30);
  }else{gs.storyTyping=false;}
}
function advStory(){
  if(gs.storyTyping){clearTimeout(gs.storyTimer);gs.storyShown=gs.storyFull;document.getElementById('story-txt').textContent=gs.storyShown;gs.storyTyping=false;return;}
  nextStory();
}
function endStory(){gs.storyActive=false;document.getElementById('story').style.display='none';}
document.getElementById('story').addEventListener('click',()=>{if(gs.storyActive)advStory();});

// QUIZ
let currentQ=null;
function triggerQuiz(){
  if(gs.quizActive||gs.transitioning||gs.gameOver||gs.ended)return;
  const sIdx=gs.mapIdx-2;
  if(sIdx<0||sIdx>1)return;
  const set=quizSets[sIdx];
  const qNo=quizCount[sIdx];
  if(qNo>=set.length)return;
  currentQ={...set[qNo],sIdx,qNo};
  quizCount[sIdx]++;
  gs.quizActive=true;
  gs.storyActive=false;
  document.getElementById('story').style.display='none';
  showQuiz(currentQ);
}
function showQuiz(q){
  const done=(quizCount[0]+quizCount[1]);
  document.getElementById('quiz-no').textContent=`문제 ${done}/10`;
  document.getElementById('quiz-hp').textContent=`위장 상태: ${gs.hp}%`;
  document.getElementById('quiz-q').textContent=q.q;
  const optsEl=document.getElementById('quiz-opts');
  optsEl.innerHTML='';
  q.opts.forEach((opt,i)=>{
    const btn=document.createElement('button');
    btn.className='qopt';
    btn.textContent=`${i+1}. ${opt}`;
    btn.addEventListener('click',()=>answerQuiz(i,q.ans,btn,optsEl,q.exp));
    optsEl.appendChild(btn);
  });
  document.getElementById('quiz-exp').style.display='none';
  document.getElementById('quiz-next').style.display='none';
  document.getElementById('quiz-modal').style.display='flex';
}
function answerQuiz(sel,ans,btn,optsEl,exp){
  [...optsEl.children].forEach((b,i)=>{
    b.style.cursor='default';
    if(i===ans)b.classList.add('correct');
    else b.disabled=true;
  });
  if(sel!==ans){
    btn.classList.add('wrong');
    wrongCount++;
    gs.hp=Math.min(gs.hp+20,100);
    updateHUD();
    document.getElementById('quiz-hp').textContent=`위장 상태: ${gs.hp}%`;
    if(gs.hp>=100){
      // Show next button but mark that game over follows
      document.getElementById('quiz-exp').textContent='【해설】 '+exp;
      document.getElementById('quiz-exp').style.display='block';
      document.getElementById('quiz-next').textContent='계속 (게임 오버)...';
      document.getElementById('quiz-next').style.display='block';
      currentQ._gameOverPending=true;
      return;
    }
  }
  document.getElementById('quiz-exp').textContent='【해설】 '+exp;
  document.getElementById('quiz-exp').style.display='block';
  document.getElementById('quiz-next').style.display='block';
}
function closeQuiz(){
  document.getElementById('quiz-modal').style.display='none';
  gs.quizActive=false;
  if(currentQ&&currentQ._gameOverPending){
    showGameOver();
    return;
  }
  gs.hitCD=200;
}
function showGameOver(){
  document.getElementById('gameover-screen').style.display='flex';
  gs.gameOver=true;
}
function retryGame(){
  document.getElementById('gameover-screen').style.display='none';
  // Reset everything
  quizSets=pickQuiz();
  quizCount=[0,0]; wrongCount=0;
  gs.mapIdx=0;gs.px=80;gs.py=GROUND_Y;
  gs.hp=0;gs.transitioning=false;gs.storyActive=false;
  gs.slimes=[];gs.slimeTimer=0;gs.hitCD=0;
  gs.quizActive=false;gs.gameOver=false;gs.ended=false;
  gs.mapEntryDone={};
  gs.moving=false;gs.fIdx=0;gs.fTimer=0;
  storyQueue=[];
  endStory();
  updateHUD();
  setTimeout(()=>showStories(STORY_MAP[0]),400);
}
function restartAll(){
  document.getElementById('ending-screen').style.display='none';
  retryGame();
}

// ENDING
function showEnding(){
  gs.ended=true;
  const correct=10-wrongCount;
  document.getElementById('ending-screen').style.display='flex';
  document.getElementById('end-msg').textContent=
`눈을 떴다.

수술실 천장이 보인다.
하얗고, 밝고, 익숙한 냄새.

"수술 잘 됐어요. 하부식도괄약근 강화 수술(Fundoplication),
 생각보다 훨씬 깔끔하게 됐습니다."

...역류성 식도염.
몇 년 동안 날 괴롭혀온 그 통증.
드디어 끝났다.

수상한 할아버지, 그 수상한 약...
꿈이었지만 — 고마웠어.

덕분에 GERD를 제대로 이해했으니까.`;
  document.getElementById('end-score').textContent=`10문제 중 ${correct}개 정답! (${correct*10}점)`;
}

// SLIMES
function spawnSlime(){
  // Wider spawn area, trickier angles
  const side=Math.random()>.5;
  gs.slimes.push({
    x: 20+Math.random()*(CW-40),
    y: -50,
    vy: 4.2+Math.random()*3.2,
    vx: (Math.random()-.5)*1.8,
    w:42, h:50, alpha:0
  });
}
function updateSlimes(){
  if(gs.mapIdx<2||gs.quizActive||gs.storyActive||gs.transitioning||gs.gameOver||gs.ended)return;
  gs.slimeTimer++;
  // More frequent: 28-50 ticks, 2-4 at once
  if(gs.slimeTimer>28+Math.floor(Math.random()*22)){
    gs.slimeTimer=0;
    const n=2+Math.floor(Math.random()*3);
    for(let i=0;i<n;i++)spawnSlime();
  }
  if(gs.hitCD>0)gs.hitCD--;
  gs.slimes=gs.slimes.filter(s=>{
    s.y+=s.vy; s.x+=s.vx;
    s.alpha=Math.min(s.alpha+0.12,1);
    if(gs.hitCD<=0&&
       s.x<gs.px+PW-4&&s.x+s.w>gs.px+4&&
       s.y<gs.py+PH-8&&s.y+s.h>gs.py+8){
      triggerQuiz();
      return false;
    }
    return s.y<PLAY_H+30;
  });
}

// TRANSITION
function transitionTo(nextIdx){
  if(gs.transitioning||gs.gameOver||gs.ended)return;
  gs.transitioning=true;
  const fade=document.getElementById('fade');
  fade.style.opacity='1';
  setTimeout(()=>{
    gs.mapIdx=nextIdx; gs.px=60; gs.py=GROUND_Y;
    gs.slimes=[]; gs.slimeTimer=0;
    endStory();
    updateHUD();
    setTimeout(()=>{
      fade.style.opacity='0';
      setTimeout(()=>{
        gs.transitioning=false;
        const k=gs.mapIdx;
        if(!gs.mapEntryDone[k]){
          gs.mapEntryDone[k]=true;
          setTimeout(()=>showStories(STORY_MAP[k]||[]),500);
        }
      },700);
    },350);
  },700);
}

// MAIN LOOP
function update(){
  if(gs.transitioning||gs.quizActive||gs.gameOver||gs.ended)return;
  const ml=gs.keys['ArrowLeft'], mr=gs.keys['ArrowRight'];
  gs.moving=ml||mr;
  if(!gs.storyActive){
    if(mr){gs.dir='right';gs.px=Math.min(gs.px+WALK,CW-PW-10);}
    if(ml){gs.dir='left';gs.px=Math.max(gs.px-WALK,10);}
  }
  if(gs.moving&&!gs.storyActive){
    gs.fTimer++;
    if(gs.fTimer>=FD){gs.fTimer=0;gs.fIdx=(gs.fIdx+1)%4;}
  }else{gs.fIdx=0;gs.fTimer=0;}
  if(gs.px>=CW-PW-12&&gs.mapIdx<MAPS.length-1&&!gs.storyActive){
    if(gs.mapIdx===3){showEnding();}
    else transitionTo(gs.mapIdx+1);
  }
  updateSlimes();
}

function render(){
  ctx.clearRect(0,0,CW,CH);
  const bgI=bgImgs[MAPS[gs.mapIdx]];
  if(bgI?.complete&&bgI.naturalWidth)ctx.drawImage(bgI,0,0,CW,PLAY_H);
  else{ctx.fillStyle='#1a0a0a';ctx.fillRect(0,0,CW,PLAY_H);}

  // Slimes
  gs.slimes.forEach(s=>{
    ctx.save();
    ctx.globalAlpha=s.alpha;
    if(slimeImg.complete&&slimeImg.naturalWidth)ctx.drawImage(slimeImg,s.x,s.y,s.w,s.h);
    else{ctx.fillStyle='rgba(0,220,0,.7)';ctx.beginPath();ctx.arc(s.x+s.w/2,s.y+s.h/2,s.w/2,0,Math.PI*2);ctx.fill();}
    ctx.restore();
  });

  // Hit flash
  if(gs.hitCD>160){
    ctx.fillStyle=`rgba(255,0,0,${(gs.hitCD-160)/60*.3})`;
    ctx.fillRect(0,0,CW,PLAY_H);
  }

  // Character
  const fBase=gs.dir==='left'?0:4;
  const fr=charFrames[fBase+(gs.moving?gs.fIdx:0)];
  if(fr?.complete&&fr.naturalWidth)ctx.drawImage(fr,gs.px,gs.py,PW,PH);
  else{ctx.fillStyle='#4CAF50';ctx.fillRect(gs.px,gs.py,PW,PH);}
}

let tick=0;
function loop(){
  tick++;
  update();
  render();
  gs.loopId=requestAnimationFrame(loop);
}

function startGame(){
  document.getElementById('intro').style.display='none';
  document.getElementById('game').style.display='block';
  updateHUD();
  gs.mapEntryDone[0]=true;
  setTimeout(()=>showStories(STORY_MAP[0]),500);
  loop();
}

// KEYBOARD
document.addEventListener('keydown',e=>{
  gs.keys[e.code]=true;
  if((e.code==='Space'||e.code==='Enter')){
    e.preventDefault();
    if(document.getElementById('intro').style.display!=='none')advIntro();
    else if(gs.storyActive)advStory();
  }
  if(['ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
});
document.addEventListener('keyup',e=>{gs.keys[e.code]=false;});
</script>
