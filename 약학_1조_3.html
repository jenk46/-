<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소화궤양 퀴즈 게임</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;font-family:'Noto Sans KR',sans-serif;background:#0B1928;}
body{display:flex;}

/* ── LEFT PANEL ── */
#panel-left{
  width:340px;flex-shrink:0;
  background:linear-gradient(180deg,#0E2038 0%,#0B1928 100%);
  border-right:1px solid rgba(255,255,255,0.06);
  display:flex;flex-direction:column;align-items:center;
  padding:1.1rem 0.9rem;gap:0.65rem;overflow:hidden;
}
.lp-label{
  font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(255,255,255,.28);
}
.lp-card{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.07);
  border-radius:14px;width:100%;
  display:flex;flex-direction:column;align-items:center;
  padding:.85rem .75rem;gap:.55rem;
}
.hp-wrap{width:92%;}
.hp-labels{display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,.32);margin-bottom:4px;}
.hp-bg{background:rgba(255,255,255,.09);border-radius:99px;height:7px;overflow:hidden;}
.hp-fill{height:7px;border-radius:99px;transition:width .7s ease,background .7s ease;}
.status-txt{font-size:12.5px;font-weight:600;text-align:center;transition:color .5s;min-height:20px;}
.divider{width:88%;height:1px;background:rgba(255,255,255,.06);}
.stomach-txt{font-size:10.5px;color:rgba(255,255,255,.3);text-align:center;}
.score-blk{text-align:center;}
.score-big{font-size:32px;font-weight:700;color:#5DCAA5;line-height:1;}
.score-lbl{font-size:10.5px;color:rgba(255,255,255,.3);}

/* Flash overlay */
#flash{
  position:fixed;top:0;left:0;width:340px;height:100%;
  pointer-events:none;opacity:0;z-index:99;
  transition:opacity .2s;
}

/* ── RIGHT PANEL ── */
#panel-right{
  flex:1;background:#F2F5F9;
  display:flex;flex-direction:column;overflow:hidden;
}

/* Quiz screen */
#quiz-screen{
  flex:1;display:flex;flex-direction:column;
  padding:2.1rem 2.6rem;overflow-y:auto;
}
.q-header{display:flex;align-items:center;gap:13px;margin-bottom:1.65rem;}
.q-ctr{font-size:11.5px;color:#909090;font-weight:600;white-space:nowrap;}
.prog-bg{flex:1;height:5px;background:#DDE2EA;border-radius:99px;overflow:hidden;}
.prog-fill{height:5px;background:#1A9B72;border-radius:99px;transition:width .4s ease;}
.score-pill{
  background:#E0F5EC;color:#0D6550;
  font-size:12px;font-weight:700;
  padding:5px 14px;border-radius:99px;white-space:nowrap;
}

.q-card{
  background:#fff;border-radius:16px;
  padding:1.55rem 1.75rem;
  box-shadow:0 2px 14px rgba(0,0,0,.07);
  margin-bottom:1rem;
}
.q-tag{
  display:inline-block;font-size:10px;font-weight:700;
  letter-spacing:.06em;background:#E0F5EC;color:#0D6550;
  padding:4px 12px;border-radius:99px;margin-bottom:.85rem;
}
.q-text{font-size:15px;font-weight:700;color:#151515;line-height:1.82;}

.options{display:flex;flex-direction:column;gap:9px;margin-bottom:.9rem;}
.opt{
  display:flex;align-items:flex-start;gap:11px;
  background:#fff;border:1.5px solid #E2E8F0;
  border-radius:12px;padding:12px 15px;
  cursor:pointer;font-size:13.5px;color:#2D2D2D;
  line-height:1.58;text-align:left;
  font-family:'Noto Sans KR',sans-serif;
  transition:border-color .15s,background .15s,transform .15s;
}
.opt:hover:not(:disabled){border-color:#1A9B72;background:#F3FBF8;transform:translateX(4px);}
.opt-n{
  flex-shrink:0;width:22px;height:22px;border-radius:50%;
  background:#EEF1F5;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#777;margin-top:1px;
}
.opt.ok{background:#EBF6D6;border-color:#5FA810;color:#254706;}
.opt.ok .opt-n{background:#5FA810;color:#fff;}
.opt.ng{background:#FDECEC;border-color:#C63030;color:#460E0E;}
.opt.ng .opt-n{background:#C63030;color:#fff;}
.opt.hl{background:#EBF6D6;border-color:#5FA810;color:#254706;opacity:.6;}
.opt.hl .opt-n{background:#5FA810;color:#fff;}
.opt:disabled{cursor:default;transform:none;}

.expl{
  background:#F6F9FC;border-left:3px solid #1A9B72;
  border-radius:0 10px 10px 0;padding:13px 17px;
  font-size:13px;color:#445;line-height:1.72;
  display:none;margin-bottom:.9rem;
}
.expl.show{display:block;}

.next-btn{
  align-self:flex-start;padding:12px 28px;
  background:#1A9B72;color:#fff;border:none;
  border-radius:10px;font-size:14px;font-weight:700;
  cursor:pointer;font-family:'Noto Sans KR',sans-serif;
  transition:background .15s,transform .1s;display:none;
}
.next-btn:hover{background:#0E6A4D;transform:translateY(-1px);}
.next-btn.show{display:block;}

/* ── RESULT SCREEN ── */
#result-screen{
  display:none;flex-direction:column;align-items:center;
  justify-content:flex-start;padding:2.5rem 3rem;
  text-align:center;flex:1;overflow-y:auto;
}
#result-screen.show{display:flex;}
.r-emoji{font-size:62px;margin-bottom:.45rem;}
.r-title{font-size:23px;font-weight:700;color:#151515;margin-bottom:.4rem;}
.r-sub{font-size:13.5px;color:#777;max-width:400px;line-height:1.68;margin-bottom:1.2rem;}
.r-score{font-size:56px;font-weight:700;color:#1A9B72;line-height:1;}
.r-denom{font-size:13.5px;color:#999;margin-bottom:1.5rem;}
.restart-btn{
  padding:13px 36px;background:#1A9B72;color:#fff;
  border:none;border-radius:11px;font-size:14.5px;font-weight:700;
  cursor:pointer;font-family:'Noto Sans KR',sans-serif;
  transition:background .15s;
}
.restart-btn:hover{background:#0E6A4D;}
.bk-wrap{width:100%;max-width:520px;margin-top:1.75rem;text-align:left;}
.bk-head{font-size:12px;font-weight:700;color:#555;margin-bottom:.6rem;}
.bk-item{
  display:flex;align-items:flex-start;gap:9px;
  padding:9px 0;border-top:1px solid #E8EBF0;font-size:13px;
}
.bk-q{color:#2D2D2D;font-weight:500;}
.bk-a{font-size:11.5px;color:#888;margin-top:2px;}

/* SVG face transitions */
#mouth{transition:d .52s ease;}
#brow-l,#brow-r{transition:d .45s ease;}
#eye-cov-l,#eye-cov-r{transition:opacity .4s ease;}
#blush-l,#blush-r{transition:opacity .4s ease;}
#sweat{transition:opacity .38s ease;}
#tears{transition:opacity .38s ease;}
/* Stomach transitions */
.ulcer-g{
  transform-box:fill-box;transform-origin:center;
  transition:transform .7s cubic-bezier(.4,0,.2,1);
}
#inflame-tint{transition:opacity .65s ease;}
#healed-g{transition:opacity .65s ease;}
</style>
</head>
<body>

<!-- Flash overlay -->
<div id="flash"></div>

<!-- ══════════════════════ LEFT PANEL ══════════════════════ -->
<div id="panel-left">
  <div class="lp-label">환자 케어 시뮬레이터</div>

  <!-- Patient card -->
  <div class="lp-card">

    <!-- Patient SVG -->
    <svg viewBox="0 0 160 192" width="148" height="168" xmlns="http://www.w3.org/2000/svg">
      <!-- Body / coat -->
      <rect x="22" y="138" width="116" height="58" rx="18" fill="#C9E4F7"/>
      <!-- Lapels -->
      <polygon points="55,138 80,165 80,138" fill="#FFF"/>
      <polygon points="105,138 80,165 80,138" fill="#FFF"/>
      <!-- Shirt strip -->
      <rect x="72" y="138" width="16" height="28" fill="#E5EFF8"/>
      <!-- Coat buttons -->
      <circle cx="80" cy="163" r="2.8" fill="#9EC4DE"/>
      <circle cx="80" cy="174" r="2.8" fill="#9EC4DE"/>
      <!-- Stethoscope -->
      <path d="M48,152 C40,164 37,181 55,186" stroke="#6282A2" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <circle cx="55" cy="186" r="5.5" fill="#849EC2" stroke="#5272A0" stroke-width="1.3"/>
      <!-- Neck -->
      <rect x="65" y="122" width="30" height="22" rx="10" fill="#F4C394"/>
      <!-- Head -->
      <ellipse cx="80" cy="88" rx="46" ry="47" fill="#FDD9B4"/>
      <!-- Hair -->
      <path d="M34,82 Q32,42 80,38 Q128,42 126,82" fill="#221510"/>
      <ellipse cx="80" cy="50" rx="46" ry="18" fill="#221510"/>
      <!-- Left ear -->
      <ellipse cx="34" cy="90" rx="9" ry="12.5" fill="#F4BE90"/>
      <ellipse cx="34" cy="90" rx="5.5" ry="8" fill="#EEAE80"/>
      <!-- Right ear -->
      <ellipse cx="126" cy="90" rx="9" ry="12.5" fill="#F4BE90"/>
      <ellipse cx="126" cy="90" rx="5.5" ry="8" fill="#EEAE80"/>
      <!-- Eyebrows -->
      <path id="brow-l" d="M47,72 Q59,63 70,72" stroke="#221510" stroke-width="3.3" fill="none" stroke-linecap="round"/>
      <path id="brow-r" d="M90,72 Q101,63 113,72" stroke="#221510" stroke-width="3.3" fill="none" stroke-linecap="round"/>
      <!-- Eye whites -->
      <ellipse cx="62" cy="87" rx="11.5" ry="12.5" fill="#fff"/>
      <ellipse cx="98" cy="87" rx="11.5" ry="12.5" fill="#fff"/>
      <!-- Pupils -->
      <ellipse cx="62" cy="88" rx="6.5" ry="7.5" fill="#1A0E08"/>
      <ellipse cx="98" cy="88" rx="6.5" ry="7.5" fill="#1A0E08"/>
      <!-- Highlights -->
      <ellipse cx="65" cy="84.5" rx="2.8" ry="3.2" fill="#fff"/>
      <ellipse cx="101" cy="84.5" rx="2.8" ry="3.2" fill="#fff"/>
      <!-- Happy-squint covers (arc that hides lower part of eye when smiling) -->
      <path id="eye-cov-l" d="M50,87 Q62,77 74,87" fill="#FDD9B4" opacity="0"/>
      <path id="eye-cov-r" d="M86,87 Q98,77 110,87" fill="#FDD9B4" opacity="0"/>
      <!-- Nose -->
      <path d="M76,100 Q80,105 84,100" stroke="#D4905C" stroke-width="1.9" fill="none"/>
      <!-- Mouth -->
      <path id="mouth" d="M64,114 Q80,124 96,114" stroke="#C07060" stroke-width="2.9" fill="none" stroke-linecap="round"/>
      <!-- Blush -->
      <ellipse id="blush-l" cx="43" cy="103" rx="15" ry="9.5" fill="#FFB0B0" opacity="0"/>
      <ellipse id="blush-r" cx="117" cy="103" rx="15" ry="9.5" fill="#FFB0B0" opacity="0"/>
      <!-- Sweat drop -->
      <g id="sweat" opacity="0">
        <ellipse cx="122" cy="73" rx="5" ry="7.5" fill="#88C4E8"/>
        <path d="M122,65 L116.5,73 L127.5,73 Z" fill="#88C4E8"/>
      </g>
      <!-- Tears -->
      <g id="tears" opacity="0">
        <ellipse cx="53" cy="101" rx="4" ry="7" fill="#88C4E8"/>
        <ellipse cx="89" cy="101" rx="4" ry="7" fill="#88C4E8"/>
      </g>
      <!-- Name badge -->
      <rect x="52" y="154" width="56" height="22" rx="5" fill="#127055" opacity="0.94"/>
      <text x="80" y="169" text-anchor="middle" fill="#fff" font-size="10" font-family="'Noto Sans KR',sans-serif" font-weight="700">김 환 자</text>
    </svg>

    <!-- Health bar -->
    <div class="hp-wrap">
      <div class="hp-labels"><span>건강 상태</span><span id="hp-pct">60%</span></div>
      <div class="hp-bg"><div class="hp-fill" id="hp-fill" style="width:60%;background:#EF9F27;"></div></div>
    </div>
    <div class="status-txt" id="status-txt" style="color:rgba(255,200,100,.85);">치료 중...</div>
  </div>

  <div class="divider"></div>

  <!-- Stomach card -->
  <div class="lp-card">
    <div class="lp-label">위 상태</div>

    <svg viewBox="0 0 144 122" width="130" height="110" xmlns="http://www.w3.org/2000/svg">
      <!-- Stomach body -->
      <path d="M31,21 Q16,10 16,31 Q10,52 16,74 Q22,98 52,114 Q78,126 98,109 Q124,94 128,67 Q134,42 116,27 Q99,13 78,17 Q57,8 31,21 Z"
        fill="#FDEAEA" stroke="#E8A0A0" stroke-width="2.2"/>
      <!-- Inner mucosa -->
      <path d="M38,28 Q24,18 24,36 Q19,56 25,76 Q32,97 56,111 Q78,120 96,107 Q118,92 121,67 Q125,45 110,32 Q96,21 77,25 Q58,16 38,28 Z"
        fill="#FFF4F4" stroke="#F0B0B0" stroke-width="1.2"/>
      <!-- Gastric rugae lines -->
      <path d="M38,54 Q72,50 104,56" stroke="#F0A8A8" stroke-width="1" fill="none" opacity=".5"/>
      <path d="M34,70 Q70,65 106,71" stroke="#F0A8A8" stroke-width="1" fill="none" opacity=".42"/>
      <path d="M37,85 Q70,81 104,86" stroke="#F0A8A8" stroke-width="1" fill="none" opacity=".36"/>

      <!-- Inflammation tint (behind ulcers) -->
      <path id="inflame-tint"
        d="M31,21 Q16,10 16,31 Q10,52 16,74 Q22,98 52,114 Q78,126 98,109 Q124,94 128,67 Q134,42 116,27 Q99,13 78,17 Q57,8 31,21 Z"
        fill="#E24B4A" opacity="0"/>

      <!-- Main ulcer -->
      <g id="u-main" class="ulcer-g">
        <circle cx="74" cy="74" r="28" fill="#F7C1C1" opacity=".42"/>
        <circle cx="74" cy="74" r="20" fill="#E24B4A" opacity=".36"/>
        <circle cx="74" cy="74" r="13" fill="#E24B4A" opacity=".65"/>
        <circle cx="74" cy="74" r="7" fill="#981E1E" opacity=".9"/>
        <circle cx="74" cy="74" r="3.5" fill="#540808"/>
      </g>

      <!-- Secondary ulcer -->
      <g id="u-sec" class="ulcer-g">
        <circle cx="49" cy="55" r="16" fill="#F7C1C1" opacity=".4"/>
        <circle cx="49" cy="55" r="10.5" fill="#E24B4A" opacity=".52"/>
        <circle cx="49" cy="55" r="6" fill="#981E1E" opacity=".88"/>
        <circle cx="49" cy="55" r="2.8" fill="#540808"/>
      </g>

      <!-- Tertiary ulcer -->
      <g id="u-tri" class="ulcer-g">
        <circle cx="99" cy="91" r="13" fill="#F7C1C1" opacity=".4"/>
        <circle cx="99" cy="91" r="8" fill="#E24B4A" opacity=".52"/>
        <circle cx="99" cy="91" r="4.5" fill="#981E1E" opacity=".88"/>
        <circle cx="99" cy="91" r="2" fill="#540808"/>
      </g>

      <!-- Healed overlay -->
      <g id="healed-g" style="opacity:0;">
        <circle cx="74" cy="74" r="22" fill="#B5D98A" opacity=".52"/>
        <circle cx="74" cy="74" r="13" fill="#93C24E" opacity=".5"/>
        <text x="74" y="79" text-anchor="middle" fill="#214808" font-size="18">✓</text>
      </g>
    </svg>

    <div class="stomach-txt" id="stomach-txt">궤양 진행 중</div>
  </div>

  <!-- Score -->
  <div class="score-blk">
    <div class="score-big" id="score-big">0</div>
    <div class="score-lbl" id="score-lbl">/ 0 문제 정답</div>
  </div>
</div>

<!-- ══════════════════════ RIGHT PANEL ══════════════════════ -->
<div id="panel-right">

  <!-- Quiz screen -->
  <div id="quiz-screen">
    <div class="q-header">
      <span class="q-ctr" id="q-ctr">1 / 12</span>
      <div class="prog-bg"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
      <div class="score-pill" id="score-pill">0점</div>
    </div>

    <div class="q-card">
      <div class="q-tag" id="q-tag">—</div>
      <div class="q-text" id="q-text">—</div>
    </div>

    <div class="options" id="options"></div>
    <div class="expl" id="expl"></div>
    <button class="next-btn" id="next-btn">다음 문제 →</button>
  </div>

  <!-- Result screen -->
  <div id="result-screen">
    <div class="r-emoji" id="r-emoji">🏆</div>
    <div class="r-title" id="r-title">—</div>
    <div class="r-sub"   id="r-sub">—</div>
    <div class="r-score" id="r-score">0</div>
    <div class="r-denom" id="r-denom">/ 12 정답</div>
    <button class="restart-btn" onclick="startGame()">↺ 다시 도전하기</button>
    <div class="bk-wrap">
      <div class="bk-head">📋 문제별 결과</div>
      <div id="bk-items"></div>
    </div>
  </div>

</div><!-- end panel-right -->

<script>
// ═══════════════════════════════════════════════════════════
//  QUESTIONS  (12 questions, significantly harder difficulty)
// ═══════════════════════════════════════════════════════════
const QS = [
  {
    tag:"제균요법 - 순차치료",
    q:"H. pylori 순차치료(Sequential therapy)에서 전반부 5일과 후반부 5일의 약물 구성으로 옳은 것은?",
    opts:[
      "전반부: PPI + Clarithromycin → 후반부: PPI + Amoxicillin + Metronidazole",
      "전반부: PPI + Amoxicillin → 후반부: PPI + Clarithromycin + Metronidazole",
      "전반부: PPI + Bismuth + Tetracycline → 후반부: PPI + Metronidazole",
      "전반부: PPI + Metronidazole → 후반부: PPI + Amoxicillin + Levofloxacin"
    ],
    ans:1,
    exp:"순차치료는 전반부 5일: PPI + Amoxicillin, 후반부 5일: PPI + Clarithromycin + Metronidazole입니다. Amoxicillin이 먼저 균 수와 세포막 투과성을 바꾸어 Clarithromycin 내성 발현을 억제하는 원리입니다."
  },
  {
    tag:"제균요법 - Bismuth 4제",
    q:"Bismuth 4제요법(Bismuth quadruple therapy)에서 PPI 이외의 3가지 약물 조합으로 옳은 것은?",
    opts:[
      "Amoxicillin + Clarithromycin + Metronidazole",
      "Clarithromycin + Tetracycline + Metronidazole",
      "Bismuth subcitrate + Tetracycline + Metronidazole",
      "Bismuth subcitrate + Amoxicillin + Levofloxacin"
    ],
    ans:2,
    exp:"Bismuth 4제요법은 PPI + Bismuth subcitrate + Tetracycline + Metronidazole로 구성됩니다. Clarithromycin 내성률이 높은 지역이나 1차 3제요법 실패 후 2차 치료로 사용합니다."
  },
  {
    tag:"H. pylori 진단 - 내시경",
    q:"내시경 검사 중 민감도·특이도 >95%의 표준 검사(gold standard)이지만, 비용 문제로 초기 검사로 권장되지 않는 것은?",
    opts:[
      "신속요소분해효소검사(Rapid urease test)",
      "조직검사(Histology)",
      "배양검사(Culture)",
      "중합효소연쇄반응(PCR) 검사"
    ],
    ans:1,
    exp:"조직검사는 민감도·특이도 모두 >95%인 표준 검사이지만, 신속요소분해효소검사에 비해 비용이 높아 초기 검사로는 권장되지 않습니다. 신속요소분해효소검사는 비용이 저렴하고 결과를 빠르게 얻을 수 있어 선호됩니다."
  },
  {
    tag:"NSAIDs 예방전략",
    q:"심혈관 질환 위험 낮음 + 소화성궤양 위험 높음인 환자에서 NSAIDs 장기 복용 시 권장 예방 전략은?",
    opts:[
      "비선택적 NSAIDs 단독 → 증상 발생 시 PPI 추가",
      "비선택적 NSAIDs + H2RA 병용",
      "선택적 COX-2 차단제 단독, 또는 비선택적 NSAIDs + PPI 병용",
      "Misoprostol + 비선택적 NSAIDs 병용"
    ],
    ans:2,
    exp:"심혈관 위험 낮음 + 소화궤양 위험 높음: 선택적 COX-2 차단제 단독 사용 또는 비선택적 NSAIDs + PPI 병용이 권장됩니다. H2RA는 PPI보다 예방 효과가 열등하며, Misoprostol은 PPI를 사용할 수 없을 때만 고려합니다."
  },
  {
    tag:"SRMD 예방 - H2RA vs PPI",
    q:"SRMD 예방에서 H2RA 정주를 장기 사용할 때 발생하는 문제로 H2RA 대신 PPI를 1차 선택으로 권장하는 주된 이유는?",
    opts:[

// ═══════════════════════════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════════════════════════
let curQ=0, score=0, hp=3, answered=false;
let shuffled=[], results=[];

// Apply health state to all visual elements
function applyHP(h){
  const c=HC[h];
  // Bar
  const bar=document.getElementById("hp-fill");
  bar.style.width=c.barW; bar.style.background=c.barC;
  document.getElementById("hp-pct").textContent=c.hpTxt;
  // Status
  const sm=document.getElementById("status-txt");
  sm.textContent=c.sTxt; sm.style.color=c.sClr;
  // Face - mouth & brows
  document.getElementById("mouth").setAttribute("d",c.mouth);
  document.getElementById("brow-l").setAttribute("d",c.browL);
  document.getElementById("brow-r").setAttribute("d",c.browR);
  // Eyes / face details
  document.getElementById("eye-cov-l").setAttribute("opacity",c.squint);
  document.getElementById("eye-cov-r").setAttribute("opacity",c.squint);
  document.getElementById("blush-l").setAttribute("opacity",c.blush);
  document.getElementById("blush-r").setAttribute("opacity",c.blush);
  document.getElementById("sweat").setAttribute("opacity",c.sweat);
  document.getElementById("tears").setAttribute("opacity",c.tear);
  // Stomach ulcers
  document.getElementById("u-main").style.transform="scale("+c.uMain+")";
  document.getElementById("u-sec").style.transform="scale("+c.uSec+")";
  document.getElementById("u-tri").style.transform="scale("+c.uTri+")";
  document.getElementById("healed-g").style.opacity=c.healed;
  document.getElementById("inflame-tint").style.opacity=c.inflame;
  document.getElementById("stomach-txt").textContent=c.stomTxt;
}

// Left panel flash on answer
function flash(ok){
  const f=document.getElementById("flash");
  f.style.background=ok?"rgba(26,155,114,.22)":"rgba(180,40,40,.22)";
  f.style.opacity="1";
  setTimeout(()=>f.style.opacity="0",500);
}

// Update all score/counter displays
function updateUI(){
  const total=shuffled.length;
  document.getElementById("q-ctr").textContent=(curQ+1)+" / "+total;
  document.getElementById("prog-fill").style.width=((curQ/total)*100)+"%";
  document.getElementById("score-pill").textContent=score+"점";
  document.getElementById("score-big").textContent=score;
  document.getElementById("score-lbl").textContent="/ "+curQ+" 문제 정답";
}

// Load current question into DOM
function loadQ(){
  answered=false;
  const q=shuffled[curQ];
  document.getElementById("q-tag").textContent=q.tag;
  document.getElementById("q-text").textContent=q.q;
  const ods=document.getElementById("options");
  ods.innerHTML="";
  q.opts.forEach((o,i)=>{
    const b=document.createElement("button");
    b.className="opt";
    b.innerHTML='<span class="opt-n">'+(i+1)+'</span><span>'+o+'</span>';
    b.onclick=()=>pick(i);
    ods.appendChild(b);
  });
  document.getElementById("expl").className="expl";
  document.getElementById("next-btn").className="next-btn";
}

// Handle answer selection
function pick(idx){
  if(answered)return;
  answered=true;
  const q=shuffled[curQ];
  const ok=(idx===q.ans);
  if(ok){score++;hp=Math.min(5,hp+1);flash(true);}
  else{hp=Math.max(0,hp-1);flash(false);}
  results.push({q:q.q,ok,ca:q.opts[q.ans]});
  applyHP(hp);
  updateUI();
  // Style buttons
  document.querySelectorAll(".opt").forEach((b,i)=>{
    b.disabled=true;
    if(i===q.ans&&i===idx)b.classList.add("ok");
    else if(i===idx)b.classList.add("ng");
    else if(i===q.ans)b.classList.add("hl");
  });
  // Explanation
  const ex=document.getElementById("expl");
  ex.innerHTML=(ok?"<strong>✅ 정답!</strong> ":"<strong>❌ 오답.</strong> ")+q.exp;
  ex.classList.add("show");
  // Next button
  const nb=document.getElementById("next-btn");
  nb.textContent=curQ<shuffled.length-1?"다음 문제 →":"결과 보기 →";
  nb.classList.add("show");
}

document.getElementById("next-btn").addEventListener("click",()=>{
  curQ++;
  if(curQ>=shuffled.length)showResult();
  else{updateUI();loadQ();}
});

// Show final result screen
function showResult(){
  document.getElementById("quiz-screen").style.display="none";
  const rs=document.getElementById("result-screen");
  rs.classList.add("show");
  const total=shuffled.length;
  const pct=score/total;
  let e,t,s;
  if(pct===1)       {e="🏆";t="완벽한 이해!";s="소화성궤양의 모든 핵심 개념을 완벽히 숙지했습니다!";}
  else if(pct>=.83) {e="🌟";t="우수한 실력!";s=(total-score)+"문제 틀렸습니다. 틀린 개념을 한 번 더 복습해 보세요.";}
  else if(pct>=.58) {e="📚";t="조금 더 공부해요!";s=score+"문제 정답. 제균요법 종류, 위험인자 분류, 약물 구분을 중점 복습하세요.";}
  else              {e="💊";t="다시 도전해요!";s="강의 슬라이드를 꼼꼼히 복습한 뒤 다시 도전해 보세요!";}
  document.getElementById("r-emoji").textContent=e;
  document.getElementById("r-title").textContent=t;
  document.getElementById("r-sub").textContent=s;
  document.getElementById("r-score").textContent=score;
  document.getElementById("r-denom").textContent="/ "+total+" 정답";
  document.getElementById("bk-items").innerHTML=results.map(r=>
    '<div class="bk-item"><span>'+(r.ok?"✅":"❌")+'</span>'+
    '<div><div class="bk-q">'+r.q+'</div>'+
    (!r.ok?'<div class="bk-a">정답: '+r.ca+'</div>':'')+
    '</div></div>'
  ).join("");
}

// Start / restart the game
function startGame(){
  shuffled=QS.slice().sort(()=>Math.random()-.5);
  curQ=0;score=0;hp=3;answered=false;results=[];
  document.getElementById("result-screen").classList.remove("show");
  document.getElementById("quiz-screen").style.display="flex";
  applyHP(hp);
  updateUI();
  loadQ();
}

startGame();
</script>
